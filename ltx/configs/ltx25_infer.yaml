model:
  model_path: @LTX_CKPT@/diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors
  text_encoder_path: @LTX_CKPT@/text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors
  video_vae_path: @LTX_CKPT@/vae/ltx-2.5-video-vae-conv-bf16.safetensors
  audio_vae_path: @LTX_CKPT@/vae/ltx-2.5-audio-vae-bf16.safetensors
  training_mode: lora
lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules:
  - attn1.to_k
  - attn1.to_q
  - attn1.to_v
  - attn1.to_out.0
  - attn2.to_k
  - attn2.to_q
  - attn2.to_v
  - attn2.to_out.0
  - ff.net.0.proj
  - ff.net.2
training_strategy:
  name: flexible
  video:
    is_generated: true
    latents_dir: latents
    conditions:
    - type: reference
      latents_dir: reference_latents
      probability: 1.0
      slot_role: control
    - type: reference
      latents_dir: ref1_latents
      probability: 0.9
      time_offset: -2.0
      slot_role: image
      ref_index: 0
    - type: reference
      latents_dir: ref2_latents
      probability: 0.9
      time_offset: -2.0
      slot_role: image
      ref_index: 1
    - type: first_frame
      probability: 0.9
    slots_dir: slots
    slot_embedding: false
    slot_gate: true
optimization:
  learning_rate: 2e-4
  steps: 10000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_type: constant
  scheduler_params: {}
  enable_gradient_checkpointing: true
acceleration:
  mixed_precision_mode: bf16
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: true
data:
  preprocessed_data_root: @WORK@/dummy_precomputed
  num_dataloader_workers: 4
validation:
  samples: []
  negative_prompt: blurry, out of focus, washed out colors, excessive noise, flickering,
    distorted proportions, deformed limbs, extra limbs, floating detached objects,
    melting geometry, inconsistent perspective, camera shake, cartoonish rendering,
    unrealistic materials, AI artifacts
  video_dims:
  - 1024
  - 576
  - 121
  frame_rate: 30.0
  seed: 42
  inference_steps: 30
  interval: 100000
  video_cfg_scale: 3.0
  audio_cfg_scale: 7.0
  video_stg_scale: 1.0
  audio_stg_scale: 1.0
  stg_blocks:
  - 28
  guidance_rescale: 0.7
  video_modality_guidance_scale: 1.0
  audio_modality_guidance_scale: 3.0
  generate_audio: false
  skip_initial_validation: true
checkpoints:
  interval: 500
  keep_last_n: 40
  precision: bfloat16
  no_resume: true
flow_matching:
  timestep_sampling_mode: shifted_logit_normal
  timestep_sampling_params: {}
hub:
  push_to_hub: false
  hub_model_id: null
wandb:
  enabled: false
  project: wizard-ltx
  entity: null
  tags:
  - ltx2.5
  - ic-lora
  - mixref
  - binding
  - gate
  log_validation_videos: false
seed: 42
output_dir: @WORK@/run
